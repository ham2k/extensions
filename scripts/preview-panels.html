<!-- The page scripts/preview-panels.mjs serves: draws each rendered scene from its layers and controls. -->
<html><head><meta charset="utf-8"><title>Panel preview</title>
<!-- The app's own faces, so text measures as it will there; Google names Roboto Mono with a space. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500;700&family=Roboto:wght@400;500;700&display=block">
<!-- The app's icon set, for `icon` layers; `fa-` names show a placeholder here. -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/css/materialdesignicons.min.css">
<style>
  body { margin: 0; padding: 16px; background: #888; font-family: Roboto, -apple-system, system-ui, sans-serif; }
  header { color: #fff; font-size: 12px; margin-bottom: 12px; }
  .grid { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start; }
  figure { margin: 0; }
  figcaption { color: #fff; font-size: 11px; margin-bottom: 4px; max-width: 520px; }
  /* A drag on a pane scrolls or zooms it, as in the host, which selects no text: a browser would start a selection. */
  .pane { position: relative; overflow: hidden; border-radius: 12px; box-shadow: 0 2px 8px rgba(0, 0, 0, .3); user-select: none; -webkit-user-select: none; }
  .layer { position: absolute; transform-origin: 50% 50%; }
  .layer > svg { display: block; width: 100%; height: 100%; }
  /* Flutter keeps a layer's spaces; a browser would collapse them. */
  .text { white-space: pre; overflow: hidden; text-overflow: ellipsis; }
  .control { position: absolute; outline: 1px dashed transparent; }
  .control.native { outline: 1px dashed rgba(128, 128, 255, .6); font-size: 10px; color: #66f; overflow: hidden; }
  .button { cursor: pointer; }
  pre { background: #fee; padding: 8px; font-size: 11px; max-width: 600px; white-space: pre-wrap; margin: 0; }
  .text-content { padding: 12px; font-size: 14px; white-space: pre-wrap; }
  #sheet { position: fixed; right: 16px; top: 16px; background: #fff; padding: 12px 16px; border-radius: 12px; box-shadow: 0 4px 16px rgba(0, 0, 0, .4); max-width: 380px; font-size: 13px; z-index: 10; }
  #sheet button { float: right; }
</style></head>
<body><header id="info"></header><div class="grid" id="grid"></div>
<script>

const bind = (b, values) => {

  const v = values[w.value], matches = w.is !== undefined ? [w.is] : w.in

function paint(pane, values) {

function showSheets(sheets) {

    `<p><b>${esc(sheet.title)}</b></p>` + (sheet.text ? `<p>${esc(sheet.text)}</p>` : '') +
    (sheet.elements ?? []).map(e => e.type === 'link'

async function send(entry, control, extra = {}) {

  showSheets(answer.error ? [{ title: `${control.event} failed`, text: answer.error }, ...answer.sheets] : answer.sheets)

const figureId = entry => `case-${entry.index}-${entry.hook}-${entry.panel}`
// A stand-in for the app's `map` control: Web Mercator at `zoom.initial` round `home`, Natural Earth's
// land and its borders and lines between states and provinces (fetched once, the sea alone without them), a
// graticule, and the map's lines and markers as they look at that zoom. The
// app draws its own world, so this shows where things land, not how the map looks.
const naturalShapes = name => fetch(`https://cdn.jsdelivr.net/gh/nvkelso/natural-earth-vector@v5.1.2/geojson/${name}.geojson`)
  .then(r => r.json()).then(g => g.features.flatMap(f => f.geometry.type === 'Polygon' ? [f.geometry.coordinates] : f.geometry.coordinates)).catch(() => [])

let landShapes
const land = () => (landShapes ??= Promise.all([naturalShapes('ne_110m_land'), naturalShapes('ne_50m_lakes')])
  .then(([ground, lakes]) => ground.map(rings => ({ rings, lake: false })).concat(lakes.map(rings => ({ rings, lake: true })))))
/// Natural Earth's lines between countries, and between states and provinces, which the app draws as the view closes in.
const naturalLines = name => fetch(`https://cdn.jsdelivr.net/gh/nvkelso/natural-earth-vector@v5.1.2/geojson/${name}.geojson`)
  .then(r => r.json()).then(g => g.features.flatMap(f => f.geometry.type === 'LineString' ? [f.geometry.coordinates] : f.geometry.coordinates)).catch(() => [])
let borderLines, divisionLines
const borders = () => (borderLines ??= naturalLines('ne_50m_admin_0_boundary_lines_land'))
const divisions = () => (divisionLines ??= naturalLines('ne_50m_admin_1_states_provinces_lines'))
const argb = c => {

/// A zoom-stop value (`[[zoom, value], …]`) at a zoom, straight between the stops; a plain value as it is.
const atZoom = (v, z) => {
